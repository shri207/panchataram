    <!-- Fetch setter guard for iframe sandbox environment -->
    <script>
      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          var proto = Object.getPrototypeOf(target);
          while (!desc && proto) {
            desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (!desc) proto = Object.getPrototypeOf(proto);
          }
          if (desc && desc.get && !desc.set) {
            var originalGet = desc.get;
            var currentFetch = function() {
              return originalGet.apply(this, arguments);
            };
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              try {
                if (proto) {
                  Object.defineProperty(proto, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(val) {
                      currentFetch = val;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (err) {}
            }
          }
        } catch (e) {
          console.warn('fetch guard ignored:', e);
        }
      })();
    </script>
